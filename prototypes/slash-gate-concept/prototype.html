<!-- PROTOTYPE - NOT FOR PRODUCTION -->
<!-- Question: Does slash-to-tokenize feel good and produce the 'where does it cut?' aha? -->
<!-- Date: 2026-06-15 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slash Gate — Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #1a1a1a;
  color: #eee;
  font-family: 'Fraunces', serif;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px env(safe-area-inset-bottom);
  overflow-x: hidden;
}

/* ── LAYOUT ── */
.screen { display: none; width: 100%; max-width: 720px; }
.screen.active { display: flex; flex-direction: column; }

/* ── WORD STAGE ── */
.stage-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  margin: 32px 0 0;
}

.word-label {
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #888;
  margin-bottom: 20px;
  font-family: 'JetBrains Mono', monospace;
}

/* ── THE GATE VISUAL ── */
.gate-scene {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  min-height: 260px;
  position: relative;
  /* The whole arena is the slash surface. Static touch-action:none here is what
     stops mobile browsers from stealing a slash as a page scroll. */
  touch-action: none;
  user-select: none;
  cursor: crosshair;
}

/* Entry zone — held-back pieces sit here */
.gate-entry {
  width: 100%;
  min-height: 80px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: flex-end;
  justify-content: center;
  padding: 12px 12px 16px;
  position: relative;
}

/* The Gate bar itself */
.gate-bar {
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg, transparent 0%, #FFC107 20%, #FFC107 80%, transparent 100%);
  position: relative;
  flex-shrink: 0;
}
.gate-bar::before {
  content: 'THE GATE';
  position: absolute;
  left: 50%;
  transform: translateX(-50%) translateY(-50%);
  top: 50%;
  font-size: 9px;
  letter-spacing: 3px;
  font-family: 'JetBrains Mono', monospace;
  color: #FFC107;
  background: #1a1a1a;
  padding: 0 8px;
}

/* Through zone — valid pieces sit here */
.gate-through {
  width: 100%;
  min-height: 72px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: flex-start;
  justify-content: center;
  padding: 16px 12px 12px;
}

/* ── PIECE CHIPS ── */
.piece {
  font-family: 'JetBrains Mono', monospace;
  font-size: 26px;
  font-weight: 600;
  padding: 10px 16px;
  border-radius: 3px;
  border: 2px solid;
  white-space: nowrap;
  user-select: none;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
}
/* Freshly created pieces (a fresh cut) pop in; unchanged pieces never get this. */
.piece.piece-enter { opacity: 0; transform: scale(0.8); }

/* Held-back: red-tinted, entry side. touch-action:none is STATIC so the
   browser does not steal the slash as a scroll on mobile. */
.piece.held-back {
  background: #2a0a0a;
  border-color: #7a2020;
  color: #e06060;
  cursor: crosshair;
  touch-action: none;
}
/* Valid: green-tinted, through side */
.piece.valid {
  background: #0a1f08;
  border-color: #3a6820;
  color: #80d840;
}

/* Slash SVG overlay */
#slash-svg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 100;
}

/* ── LEDGER PANEL ── */
.ledger-panel {
  width: 100%;
  background: #242424;
  border: 1px solid #333;
  border-radius: 4px;
  padding: 14px 16px;
  margin-top: 24px;
}
.ledger-title {
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #888;
  margin-bottom: 10px;
  font-family: 'JetBrains Mono', monospace;
}
.ledger-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.ledger-chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  padding: 4px 10px;
  background: #1a1a1a;
  border: 1px solid #444;
  border-radius: 3px;
  color: #aaa;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.ledger-chip.lit {
  border-color: #4a7020;
  color: #80d840;
  background: #0e1a04;
}

/* ── INSTRUCTION HINT ── */
.hint {
  text-align: center;
  font-size: 13px;
  color: #777;
  margin-top: 20px;
  font-family: 'JetBrains Mono', monospace;
  min-height: 20px;
}

/* ── ACTION ROW ── */
.action-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-top: 18px;
}

/* ── PASS BUTTON ── */
.pass-btn {
  display: none;
  padding: 14px 48px;
  background: #3a6820;
  color: #c8f080;
  border: none;
  font-family: 'Fraunces', serif;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  border-radius: 2px;
  touch-action: manipulation;
  transition: background 0.15s;
}
.pass-btn:hover { background: #4a8030; }
.pass-btn.visible { display: block; }

/* ── RESET BUTTON (always available during play) ── */
.reset-btn {
  padding: 8px 20px;
  background: transparent;
  color: #888;
  border: 1px solid #444;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  cursor: pointer;
  border-radius: 2px;
  touch-action: manipulation;
  transition: border-color 0.15s, color 0.15s;
}
.reset-btn:hover { border-color: #888; color: #ccc; }
.reset-btn:disabled { opacity: 0.4; cursor: default; }
.reset-btn:disabled:hover { border-color: #444; color: #888; }
.ghost-row { display: flex; gap: 10px; justify-content: center; }

/* ── REVEAL SCREEN ── */
#reveal {
  gap: 24px;
  padding: 32px 0;
}

.reveal-word {
  font-family: 'JetBrains Mono', monospace;
  font-size: 28px;
  color: #FFC107;
  text-align: center;
  font-weight: 600;
}

.reveal-contrast {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.reveal-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.reveal-row-label {
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #888;
  font-family: 'JetBrains Mono', monospace;
}
.reveal-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.reveal-chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 3px;
}
.reveal-chip.model {
  background: #0a1f08;
  border: 2px solid #3a6820;
  color: #80d840;
}
.reveal-chip.player-same {
  background: #0a1f08;
  border: 2px dashed #3a6820;
  color: #80d840;
  opacity: 0.7;
}
.reveal-chip.player-diff {
  background: #2a2a0a;
  border: 2px dashed #7a6820;
  color: #c0a840;
  opacity: 0.7;
}

.reveal-insight {
  background: #1a2a1a;
  border: 1px solid #2a4a2a;
  border-radius: 4px;
  padding: 18px 20px;
}
.reveal-insight-label {
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #60a840;
  margin-bottom: 10px;
  font-family: 'JetBrains Mono', monospace;
}
.reveal-insight-text {
  font-size: 14px;
  color: #c0e880;
  line-height: 1.75;
  font-family: 'JetBrains Mono', monospace;
}

.next-btn {
  display: block;
  padding: 14px 48px;
  background: #3a5870;
  color: #80c8e8;
  border: none;
  font-family: 'Fraunces', serif;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  border-radius: 2px;
  align-self: center;
  touch-action: manipulation;
  transition: background 0.15s;
}
.next-btn:hover { background: #4a6880; }

/* ── DONE SCREEN ── */
#done {
  gap: 20px;
  padding: 40px 0;
  align-items: center;
  text-align: center;
}
.done-title {
  font-size: 42px;
  font-weight: 300;
  color: #FFC107;
  line-height: 1;
}
.done-body {
  font-size: 14px;
  color: #bbb;
  line-height: 1.85;
  max-width: 480px;
  font-family: 'JetBrains Mono', monospace;
}
.done-body strong { color: #FFC107; }
.replay-btn {
  padding: 14px 48px;
  background: #5D8733;
  color: #0d1a04;
  border: none;
  font-family: 'Fraunces', serif;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  border-radius: 2px;
  touch-action: manipulation;
  transition: background 0.15s;
}
.replay-btn:hover { background: #6b9e3e; }

/* ── DEBUG BAR (touch testing) ── */
#debug-bar {
  position: fixed;
  bottom: 0;
  bottom: env(safe-area-inset-bottom, 0);
  left: 0; right: 0;
  background: rgba(0,0,0,0.85);
  color: #FFC107;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 4px 12px;
  text-align: center;
  z-index: 200;
  pointer-events: none;
  display: none;
}

/* ── REDUCED MOTION ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ── MOBILE ── */
@media (max-width: 520px) {
  .piece { font-size: 20px; padding: 8px 12px; }
  .reveal-chip { font-size: 15px; padding: 6px 10px; }
  .reveal-insight-text { font-size: 13px; }
}
</style>
</head>
<body>

<!-- SVG slash overlay -->
<svg id="slash-svg" aria-hidden="true"></svg>

<!-- Debug bar (visible with ?debug=1) -->
<div id="debug-bar"></div>

<!-- ══════════════ GAME SCREEN ══════════════ -->
<div id="game" class="screen active">
  <div class="stage-wrap">
    <div class="word-label" id="word-label">—</div>

    <div class="gate-scene" id="arena">
      <div class="gate-entry" id="gate-entry"></div>
      <div class="gate-bar"></div>
      <div class="gate-through" id="gate-through"></div>
    </div>
  </div>

  <div class="ledger-panel">
    <div class="ledger-title">The Ledger — registered fragments</div>
    <div class="ledger-chips" id="ledger-chips"></div>
  </div>

  <div class="hint" id="hint-text"></div>
  <div class="action-row">
    <button class="pass-btn" id="pass-btn">Pass through the Gate →</button>
    <div class="ghost-row">
      <button class="reset-btn" id="undo-btn">↶ Undo slash</button>
      <button class="reset-btn" id="reset-btn">↺ Reset word</button>
    </div>
  </div>
</div>

<!-- ══════════════ REVEAL SCREEN ══════════════ -->
<div id="reveal" class="screen">
  <div class="reveal-word" id="reveal-word"></div>

  <div class="reveal-contrast">
    <div class="reveal-row">
      <div class="reveal-row-label">Your split</div>
      <div class="reveal-chips" id="reveal-player-chips"></div>
    </div>
    <div class="reveal-row">
      <div class="reveal-row-label">How the model cuts it</div>
      <div class="reveal-chips" id="reveal-model-chips"></div>
    </div>
  </div>

  <div class="reveal-insight">
    <div class="reveal-insight-label">Why here?</div>
    <div class="reveal-insight-text" id="reveal-insight-text"></div>
  </div>

  <button class="next-btn" id="next-btn">Next word →</button>
</div>

<!-- ══════════════ DONE SCREEN ══════════════ -->
<div id="done" class="screen">
  <div class="done-title">Gate cleared.</div>
  <div class="done-body">
    What you just did is called <strong>tokenization</strong>.<br><br>
    Every prompt you send gets broken this way — by frequency, not meaning.
    The model never sees letters. It sees numbers. One per piece that passed the Gate.
  </div>
  <button class="replay-btn" id="replay-btn">Play again</button>
</div>

<script>
// PROTOTYPE - NOT FOR PRODUCTION
// Question: Does slash-to-tokenize feel good and produce the 'where does it cut?' aha?
// Date: 2026-06-15

'use strict';

// ── DATA (inlined from city-of-tokens/the-gate.html ROUNDS, subset for contrast) ──
const ROUNDS = [
  {
    word: 'hello',
    correct: ['hello'],
    vocab: ['hello', 'hell', 'hel', 'he', 'ell', 'ello', 'lo', 'h', 'e', 'l', 'o'],
    insight: '"hello" is so common it earned its own entry — whole, untouched. No slashing needed. Frequent words pass through as one piece.'
  },
  {
    word: 'unhappy',
    correct: ['un', 'happy'],
    vocab: ['un', 'happy', 'hap', 'py', 'app', 'appy', 'u', 'n', 'h', 'a', 'p', 'y'],
    insight: '"un-" earned its own slot by appearing in hundreds of words — unlock, undo, unreal, unusual. "happy" is common enough on its own. Two pieces, not one whole, not five fragments.'
  },
  {
    word: 'ChatGPT',
    correct: ['Chat', 'G', 'PT'],
    vocab: ['Chat', 'G', 'PT', 'Ch', 'at', 'GP', 'T', 'C', 'h', 'a', 't', 'P'],
    insight: 'The Ledger was built before this name existed. No entry for "ChatGPT" — so the Gate improvises: Chat + G + PT. Three pieces for a word you\'d expect to be one. The vocabulary is fixed at training time.'
  },
  {
    word: 'unbelievable',
    correct: ['un', 'believ', 'able'],
    vocab: ['un', 'believ', 'able', 'bel', 'iev', 'be', 'liev', 'b', 'e', 'l', 'i', 'v', 'a'],
    insight: 'The cut lands between "believ" and "able" — not between "believe" and "able". That boundary doesn\'t follow word meaning. The algorithm (BPE) merged frequent character pairs until "believ" appeared often enough in believe, believing, believer to earn its own slot. It never knew what the word meant — it only counted.'
  },
  {
    word: 'preprocessing',
    correct: ['pre', 'processing'],
    vocab: ['pre', 'processing', 'process', 'ing', 'pro', 'cess', 'essing', 'p', 'r', 'e', 'o'],
    insight: '"pre-" is one of the most common prefixes in English — preload, preview, prepare, predict. "processing" is frequent in technical text. Two pieces for a 13-character word. Common prefixes and technical terms earn their own slots.'
  }
];

// ── STATE ──
let roundIdx = 0;
let currentWord = '';
let cuts = new Set();   // cut positions in WORD coordinates (1..len-1)
let cutHistory = [];    // same cuts in the order they were made (for undo)
let playerSplit = [];   // captured on pass
const pieceEls = new Map();  // segment key "start-end" → element (keyed reconcile, no teardown)

// ── SLASH STATE ──
let slashActive = false;
let slashPath = [];
let slashAnimId = null;
let slashPolyline = null;
let activePointerId = null;

// ── DEBUG ──
const debugMode = new URLSearchParams(location.search).has('debug');
function debugLog(msg) {
  if (!debugMode) return;
  const bar = document.getElementById('debug-bar');
  bar.style.display = 'block';
  bar.textContent = msg;
}

// ── SCREEN ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ── ROUND INIT ──
function loadRound(idx) {
  roundIdx = idx;
  cuts = new Set();
  cutHistory = [];
  playerSplit = [];

  // Fresh slate between words (the only place we tear down DOM).
  pieceEls.clear();
  document.getElementById('gate-entry').innerHTML = '';
  document.getElementById('gate-through').innerHTML = '';

  const round = ROUNDS[idx];
  currentWord = round.word;
  document.getElementById('word-label').textContent = round.word;

  renderLedger(round);
  renderGate();
}

// ── SEGMENTS (single source of truth: currentWord + cuts in word coords) ──
function getAllSegments() {
  const round = ROUNDS[roundIdx];
  const sortedCuts = [...cuts].filter(c => c > 0 && c < currentWord.length).sort((a, b) => a - b);
  const segs = [];
  let start = 0;
  for (const c of sortedCuts) {
    segs.push({ text: currentWord.slice(start, c), start, end: c });
    start = c;
  }
  segs.push({ text: currentWord.slice(start), start, end: currentWord.length });
  return segs.map(s => ({ ...s, valid: round.vocab.includes(s.text) }));
}

// ── GATE RENDER (keyed reconcile — reuse unchanged pieces, no teardown) ──
function renderGate() {
  const entry = document.getElementById('gate-entry');
  const through = document.getElementById('gate-through');
  const segs = getAllSegments();

  let anyHeldBack = false;
  let allValid = segs.length > 0;
  const desiredEntry = [];
  const desiredThrough = [];
  const desiredKeys = new Set();
  const freshEls = [];

  segs.forEach(seg => {
    const key = seg.start + '-' + seg.end;   // identity of this exact segment
    desiredKeys.add(key);
    let el = pieceEls.get(key);
    if (!el) {
      el = document.createElement('div');
      el.className = 'piece piece-enter';     // new piece (from a cut) pops in
      el.textContent = seg.text;
      pieceEls.set(key, el);
      freshEls.push(el);
    }
    el.dataset.start = String(seg.start);     // word-coord offset of this chip's first char
    el.classList.toggle('valid', seg.valid);
    el.classList.toggle('held-back', !seg.valid);
    if (seg.valid) {
      desiredThrough.push(el);
    } else {
      desiredEntry.push(el);
      anyHeldBack = true;
      allValid = false;
    }
  });

  // Remove only the pieces that no longer exist (e.g. the one that was just cut)
  for (const [key, el] of [...pieceEls]) {
    if (!desiredKeys.has(key)) { el.remove(); pieceEls.delete(key); }
  }

  // Order each zone — appendChild MOVES existing nodes, it does not recreate them,
  // so pieces that didn't change never flash.
  desiredEntry.forEach(el => entry.appendChild(el));
  desiredThrough.forEach(el => through.appendChild(el));

  // Trigger the pop-in transition on freshly created pieces only.
  if (freshEls.length) {
    requestAnimationFrame(() => freshEls.forEach(el => el.classList.remove('piece-enter')));
  }

  highlightLedger(segs.filter(s => s.valid).map(s => s.text));

  document.getElementById('undo-btn').disabled = cutHistory.length === 0;

  const passBtn = document.getElementById('pass-btn');
  if (allValid) {
    passBtn.classList.add('visible');
    setHint(cuts.size === 0
      ? 'The whole word is already in the Ledger — nothing to cut. Send it through.'
      : 'All pieces registered! Send them through the Gate.');
  } else {
    passBtn.classList.remove('visible');
    if (anyHeldBack) {
      setHint('Red pieces aren\'t in the Ledger. Slash a red piece to cut it smaller.');
    }
  }
}

// ── LEDGER ──
function renderLedger(round) {
  const unique = [...new Set(round.vocab)].sort((a, b) => b.length - a.length || a.localeCompare(b));
  document.getElementById('ledger-chips').innerHTML = unique
    .map(v => `<div class="ledger-chip" data-vocab="${escapeHtml(v)}">${escapeHtml(v)}</div>`)
    .join('');
}

function highlightLedger(matchedTexts) {
  document.querySelectorAll('.ledger-chip').forEach(chip => {
    chip.classList.toggle('lit', matchedTexts.includes(chip.dataset.vocab));
  });
}

// ── HINT ──
function setHint(msg) {
  document.getElementById('hint-text').textContent = msg;
}

// ── SLASH INPUT (single arena surface; slash-only, no tap-to-cut) ──
const MIN_SWIPE = 16; // px — anything shorter is a stray click and is ignored

function initArena() {
  const arena = document.getElementById('arena');
  arena.addEventListener('pointerdown', onPointerDown);
  arena.addEventListener('pointermove', onPointerMove);
  arena.addEventListener('pointerup', onPointerUp);
  arena.addEventListener('pointercancel', onPointerCancel);
}

function onPointerDown(e) {
  if (slashActive) return; // ignore second pointer
  e.preventDefault();
  const arena = document.getElementById('arena');
  arena.setPointerCapture(e.pointerId);
  activePointerId = e.pointerId;

  slashActive = true;
  slashPath = [{ x: e.clientX, y: e.clientY }];

  // Create SVG trail
  const svg = document.getElementById('slash-svg');
  slashPolyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
  slashPolyline.setAttribute('stroke', 'rgba(255,193,7,0.7)');
  slashPolyline.setAttribute('stroke-width', '3');
  slashPolyline.setAttribute('stroke-linecap', 'round');
  slashPolyline.setAttribute('stroke-linejoin', 'round');
  slashPolyline.setAttribute('fill', 'none');
  slashPolyline.style.filter = 'drop-shadow(0 0 4px rgba(255,193,7,0.5))';
  svg.appendChild(slashPolyline);

  scheduleTrailDraw();
  debugLog(`down (${Math.round(e.clientX)},${Math.round(e.clientY)})`);
}

function onPointerMove(e) {
  if (!slashActive || e.pointerId !== activePointerId) return;
  e.preventDefault();
  slashPath.push({ x: e.clientX, y: e.clientY });
}

function onPointerUp(e) {
  if (!slashActive || e.pointerId !== activePointerId) return;
  e.preventDefault();

  slashActive = false;
  activePointerId = null;

  if (slashAnimId) { cancelAnimationFrame(slashAnimId); slashAnimId = null; }
  fadeOutTrail(slashPolyline); slashPolyline = null;

  const path = slashPath;
  slashPath = [];
  if (path.length < 2) return;

  const dx = path[path.length - 1].x - path[0].x;
  const dy = path[path.length - 1].y - path[0].y;
  if (Math.sqrt(dx * dx + dy * dy) < MIN_SWIPE) return; // ignore clicks / tiny drags

  resolveSlash(path);
}

function onPointerCancel(e) {
  slashActive = false;
  activePointerId = null;
  if (slashAnimId) { cancelAnimationFrame(slashAnimId); slashAnimId = null; }
  fadeOutTrail(slashPolyline); slashPolyline = null;
  slashPath = [];
}

// Let the slash trail linger briefly and fade, so the gesture feels like it landed.
function fadeOutTrail(poly) {
  if (!poly) return;
  poly.style.transition = 'opacity 0.2s ease-out';
  requestAnimationFrame(() => { poly.style.opacity = '0'; });
  setTimeout(() => poly.remove(), 260);
}

function scheduleTrailDraw() {
  if (!slashActive) return;
  slashAnimId = requestAnimationFrame(() => {
    if (slashPolyline && slashPath.length > 1) {
      slashPolyline.setAttribute('points', slashPath.map(p => `${p.x},${p.y}`).join(' '));
    }
    scheduleTrailDraw();
  });
}

// ── SLASH → CUT ──
// Find which held-back chip the blade traveled through, cut it at the nearest gap.
// One slash = one cut (the first red piece the blade crosses, left to right).
function resolveSlash(path) {
  const chips = [...document.querySelectorAll('#gate-entry .piece.held-back')];
  for (const chip of chips) {
    const rect = chip.getBoundingClientRect();
    const crossX = chipSlashX(path, rect);
    if (crossX === null) continue;

    const start = parseInt(chip.dataset.start, 10);
    if (isNaN(start)) continue;
    const localGap = findNearestGap(chip, crossX);  // 1..len-1 relative to THIS chip
    if (localGap === null) continue;

    const wordGap = start + localGap;               // convert to whole-word coordinate
    if (!cuts.has(wordGap)) {
      cuts.add(wordGap);
      cutHistory.push(wordGap);
    }
    debugLog(`cut "${chip.textContent}" at local gap ${localGap} (word-pos ${wordGap})`);
    renderGate();
    return;
  }
  debugLog('slash missed — no red piece crossed');
}

// Where (clientX) did the blade travel across this chip? null if it didn't cross it.
function chipSlashX(path, rect) {
  const padY = 14;
  const xs = [];
  for (const p of path) {
    if (p.y >= rect.top - padY && p.y <= rect.bottom + padY &&
        p.x >= rect.left - 6 && p.x <= rect.right + 6) {
      xs.push(Math.max(rect.left, Math.min(rect.right, p.x)));
    }
  }
  // Slow/normal slash: use the middle of where the blade traveled across the chip.
  if (xs.length > 0) return xs[Math.floor(xs.length / 2)];
  // Fast slash (sparse samples): fall back to where the path crosses the chip's midline.
  const midY = (rect.top + rect.bottom) / 2;
  const cx = crossXAtMidY(path, midY);
  if (cx >= rect.left && cx <= rect.right) return cx;
  return null;
}

// X where the slash path crosses the chip's vertical midline; robust for shallow slashes.
function crossXAtMidY(path, midY) {
  for (let i = 1; i < path.length; i++) {
    const p0 = path[i - 1], p1 = path[i];
    if ((p0.y - midY) * (p1.y - midY) <= 0) {
      const dy = p1.y - p0.y;
      const t = Math.abs(dy) < 0.001 ? 0 : (midY - p0.y) / dy;
      return p0.x + t * (p1.x - p0.x);
    }
  }
  // No crossing — use the path point whose Y is closest to the midline.
  let best = path[0], bestD = Math.abs(path[0].y - midY);
  for (const p of path) {
    const d = Math.abs(p.y - midY);
    if (d < bestD) { bestD = d; best = p; }
  }
  return best.x;
}

// ── NEAREST-GAP HIT TEST ──
// Gap g sits between char g-1 and char g, at the midpoint of their centers.
// Returns the gap (1..len-1) whose midpoint is closest to clientX.
function findNearestGap(el, clientX) {
  const text = el.textContent;
  const len = text.length;
  if (len < 2) return null;

  const centers = getCharCenters(el, text);
  if (!centers || centers.length < 2) return null;

  let bestGap = 1, bestDist = Infinity;
  for (let g = 1; g <= len - 1; g++) {
    const gapX = (centers[g - 1] + centers[g]) / 2;
    const d = Math.abs(clientX - gapX);
    if (d < bestDist) { bestDist = d; bestGap = g; }
  }
  return bestGap;
}

function getCharCenters(el, text) {
  const textNode = el.firstChild;
  const centers = [];

  if (textNode && textNode.nodeType === Node.TEXT_NODE) {
    const range = document.createRange();
    for (let i = 0; i < text.length; i++) {
      try {
        range.setStart(textNode, i);
        range.setEnd(textNode, i + 1);
        const rects = range.getClientRects();
        if (rects.length > 0) {
          centers.push((rects[0].left + rects[0].right) / 2);
          continue;
        }
      } catch (_) { /* fall through */ }
      const elRect = el.getBoundingClientRect();
      const charW = elRect.width / text.length;
      centers.push(elRect.left + charW * i + charW / 2);
    }
  } else {
    const elRect = el.getBoundingClientRect();
    const charW = elRect.width / text.length;
    for (let i = 0; i < text.length; i++) {
      centers.push(elRect.left + charW * i + charW / 2);
    }
  }
  return centers;
}

// ── UNDO (remove only the last slash) ──
function undoLastCut() {
  if (cutHistory.length === 0) return;
  const last = cutHistory.pop();
  cuts.delete(last);
  renderGate();
}

// ── PASS THROUGH ──
function passThrough() {
  playerSplit = getAllSegments().map(s => s.text);
  showReveal();
}

// ── REVEAL ──
function showReveal() {
  const round = ROUNDS[roundIdx];
  document.getElementById('reveal-word').textContent = round.word;

  const modelSplit = round.correct;

  const playerContainer = document.getElementById('reveal-player-chips');
  playerContainer.innerHTML = '';
  playerSplit.forEach(seg => {
    const el = document.createElement('div');
    el.classList.add('reveal-chip');
    el.classList.add(modelSplit.includes(seg) ? 'player-same' : 'player-diff');
    el.textContent = seg;
    playerContainer.appendChild(el);
  });

  const modelContainer = document.getElementById('reveal-model-chips');
  modelContainer.innerHTML = '';
  modelSplit.forEach(seg => {
    const el = document.createElement('div');
    el.classList.add('reveal-chip', 'model');
    el.textContent = seg;
    modelContainer.appendChild(el);
  });

  document.getElementById('reveal-insight-text').textContent = round.insight;

  const isLast = roundIdx === ROUNDS.length - 1;
  document.getElementById('next-btn').textContent = isLast ? 'Done →' : 'Next word →';

  showScreen('reveal');
}

// ── NEXT ──
function nextRound() {
  if (roundIdx >= ROUNDS.length - 1) {
    showScreen('done');
  } else {
    showScreen('game');
    loadRound(roundIdx + 1);
  }
}

// ── UTIL ──
function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/'/g, '&#39;');
}

// ── WIRE BUTTONS ──
document.getElementById('pass-btn').addEventListener('click', passThrough);
document.getElementById('next-btn').addEventListener('click', nextRound);
document.getElementById('undo-btn').addEventListener('click', undoLastCut);
document.getElementById('reset-btn').addEventListener('click', () => loadRound(roundIdx));
document.getElementById('replay-btn').addEventListener('click', () => {
  showScreen('game');
  loadRound(0);
});

// ── BOOT ──
initArena();
loadRound(0);
</script>
