<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>City of Tokens — Overworld</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100dvh;
      overflow: hidden;
      background: #11140f;
      overscroll-behavior: none;
      font-family: 'Press Start 2P', monospace;
      color: #f4e7c1;
    }
    #world {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #11140f;
      image-rendering: pixelated;
      touch-action: none;
      outline: none;
    }
    #titlebar {
      position: absolute;
      top: env(safe-area-inset-top, 0);
      left: 0; right: 0;
      text-align: center;
      padding: 12px 8px;
      font-size: 11px;
      letter-spacing: 3px;
      color: #f2c14e;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      z-index: 5;
    }

    /* ── floating touch joystick: spawns under the finger, drag to steer (touch only) ── */
    #stick-base, #stick-knob {
      position: fixed;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;   /* never intercept the touch — it belongs to the canvas */
      z-index: 6;
    }
    #stick-base {
      width: 96px; height: 96px;
      border: 3px solid rgba(242, 193, 78, 0.5);
      background: rgba(20, 16, 8, 0.25);
    }
    #stick-knob {
      width: 44px; height: 44px;
      background: rgba(242, 193, 78, 0.55);
      z-index: 7;
    }

    /* ── toast ── */
    #toast {
      position: absolute;
      left: 50%;
      bottom: calc(28px + env(safe-area-inset-bottom, 0));
      transform: translateX(-50%);
      background: rgba(20, 16, 8, 0.92);
      border: 2px solid #f2c14e;
      color: #f4e7c1;
      font-size: 9px;
      line-height: 1.5;
      letter-spacing: 1px;
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 80vw;
      text-align: center;
      z-index: 7;
    }

    /* ── level overlay (iframe) ── */
    #overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 20;
    }
    #level-frame { width: 100%; height: 100%; border: none; display: block; }
    #overlay-close {
      position: absolute;
      top: calc(8px + env(safe-area-inset-top, 0));
      right: calc(8px + env(safe-area-inset-right, 0));
      width: 44px; height: 44px;
      border: 2px solid #f2c14e;
      background: rgba(20, 16, 8, 0.85);
      color: #f2c14e;
      font-family: inherit;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      z-index: 21;
      touch-action: manipulation;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="titlebar">CITY OF TOKENS</div>
  <canvas id="world" tabindex="0"></canvas>

  <div id="stick-base" aria-hidden="true" hidden></div>
  <div id="stick-knob" aria-hidden="true" hidden></div>

  <div id="toast" hidden></div>

  <div id="overlay" hidden>
    <button id="overlay-close" aria-label="Close level">✕</button>
    <iframe id="level-frame" title="City of Tokens level" src="about:blank"></iframe>
  </div>

  <script type="module" src="world/world-cot.js"></script>
</body>
</html>
