<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play — Concept Forge</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { background:#1a1a1a; color:#eee; font-family:'Fraunces',serif; min-height:100dvh; display:flex; flex-direction:column; align-items:center; padding:24px 16px env(safe-area-inset-bottom); }
  .wrap { width:100%; max-width:640px; }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:4px; text-transform:uppercase; color:#888; margin-bottom:8px; }
  .title { font-size:26px; font-weight:300; color:#FFC107; margin-bottom:6px; }
  .badge { font-family:'JetBrains Mono',monospace; font-size:11px; margin-bottom:16px; }
  #host { width:100%; min-height:560px; }
  .msg { font-family:'JetBrains Mono',monospace; font-size:13px; color:#999; padding:24px 0; }
  .btn { display:inline-block; margin-top:16px; padding:11px 26px; background:#3a5870; color:#80c8e8; border:none; font-family:'Fraunces',serif; font-size:15px; font-weight:600; cursor:pointer; border-radius:2px; text-decoration:none; }
  .done { display:none; font-family:'JetBrains Mono',monospace; color:#80d840; margin-top:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Concept Forge</div>
  <div class="title" id="title">—</div>
  <div class="badge" id="badge"></div>
  <div id="host"><div class="msg" id="msg">Loading game…</div></div>
  <div class="done" id="done">✓ Finished. <a class="btn" href="index.html">Make your own →</a></div>
</div>

<script src="sandbox.js"></script>
<script src="gamestore.js"></script>
<script>
'use strict';
(async () => {
  const id = new URLSearchParams(location.search).get('id');
  const host = document.getElementById('host');
  if (!id) { document.getElementById('msg').textContent = 'No game id in the link.'; return; }
  const game = await window.GameStore.loadGame(id);
  if (!game) {
    document.getElementById('msg').innerHTML = 'Game not found on this device. <a class="btn" href="index.html">Make one →</a>';
    return;
  }
  document.getElementById('title').textContent = game.concept || 'A game';
  document.getElementById('badge').innerHTML = game.verified
    ? '<span style="color:#80d840">● answers verified</span>'
    : '<span style="color:#d8a93f">● answers AI-suggested, unverified</span>';
  const res = window.Sandbox.mount(host, {
    html: game.shellHtml, rounds: game.rounds,
    onComplete: () => { document.getElementById('done').style.display = 'block'; },
  });
  if (!res.ok) host.innerHTML = '<div class="msg">This saved game can\'t be run (failed validation: ' + (res.issues || []).join(', ') + ').</div>';
})();
</script>
</body>
</html>
